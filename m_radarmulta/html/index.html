<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radares</title>
<style>
:root {
    --accent: #3b82f6;
    --bg: #0c0e13;
    --card: rgba(255, 255, 255, 0.025);
    --card-hover: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.07);
    --text: #e7e9ee;
    --muted: #8a92a3;
    --danger: #ef4444;
    --ok: #22c55e;
    --warn: #f59e0b;
    --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 Inter, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
}
button, input, select { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; }

.app { display: flex; flex-direction: column; height: 100%; }
header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
header h1 svg { color: var(--accent); }
.badge {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
    padding: 3px 8px; border-radius: 6px;
}
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.tab {
    background: none; border: 0; padding: 11px 12px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--card-hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: #fca5a5; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
.btn.danger:hover { background: rgba(239,68,68,.16); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn.on { border-color: var(--accent); color: var(--accent); }

input[type=text], input[type=number], select {
    background: rgba(0,0,0,.25); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; outline: none; width: 100%; min-width: 0;
}
input:focus, select:focus { border-color: var(--accent); }
input:disabled, select:disabled { opacity: .4; cursor: not-allowed; }
select option { background: #151821; }
.search { position: relative; width: 260px; }
.search input { padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

main { flex: 1; min-height: 0; display: flex; }
.lista {
    width: 320px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 14px;
}
.detalhe { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }

.item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius);
    border: 1px solid transparent; cursor: pointer; margin-bottom: 4px;
}
.item:hover { background: var(--card-hover); }
.item.on { background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,.04); }
.item .nome { font-weight: 600; }
.item .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .txt { min-width: 0; flex: 1; }
.grupo-titulo { color: var(--muted); font-size: 12px; margin: 16px 4px 8px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
.card h3 { margin: 0; font-size: 13px; font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.card h3 small { color: var(--muted); font-weight: 400; margin-left: auto; }
.card .corpo { padding: 14px; }
.linha { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.linha + .linha, .dica + .linha { margin-top: 14px; }
.campo { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; }
.campo label { color: var(--muted); font-size: 12px; }
.dica { color: var(--muted); font-size: 12px; margin-top: 6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
.cols .card { margin-bottom: 0; }

.topo { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.topo h2 { margin: 0; font-size: 20px; }
.topo .ids { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: inline-flex; gap: 6px; align-items: center; }
.chip.red { color: #fca5a5; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
.chip.green { color: #86efac; border-color: rgba(34,197,94,.3); background: rgba(34,197,94,.07); }
.chip.blue { color: #93c5fd; border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.07); }
.chip.yellow { color: #fcd34d; border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.07); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.stat .k { color: var(--muted); font-size: 11.5px; }
.stat .v { font-size: 16px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.barra { height: 6px; background: rgba(255,255,255,.06); border-radius: 6px; overflow: hidden; margin-top: 8px; }
.barra > div { height: 100%; background: var(--danger); transition: width .3s; }

.tabela { width: 100%; border-collapse: collapse; }
.tabela td { padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: middle; }
.tabela tr:first-child td { border-top: 0; }
.tabela .acoes { text-align: right; white-space: nowrap; }
.vazio { color: var(--muted); text-align: center; padding: 18px; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }

.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; cursor: pointer; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: rgba(255,255,255,.12); border-radius: 20px; transition: .15s; }
.toggle span::after { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(16px); }

.gang { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); }
.gang:first-child { border-top: 0; }
.gang .txt { flex: 1; min-width: 0; }
.gang .txt b { font-weight: 600; }
.gang .txt div { color: var(--muted); font-size: 12px; }
.gang select { width: 170px; }

.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast {
    background: #161a23; border: 1px solid var(--border); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 8px; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    animation: entra .18s ease-out;
}
.toast.erro { border-left-color: var(--danger); }
.toast.ok { border-left-color: var(--ok); }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }

.modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal { background: #12151c; border: 1px solid var(--border); border-radius: 12px; width: 420px; max-width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal h4 { margin: 0; padding: 16px 18px 6px; font-size: 15px; }
.modal p { margin: 0; padding: 0 18px; color: var(--muted); }
.modal .corpo { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal .pe { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; }

.carregando { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); }
.faccoes-wrap { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }
.faccoes-wrap .card { max-width: 900px; }
</style>
</head>
<body>
<div class="app" id="app"><div class="carregando">Carregando radares...</div></div>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>

<script>
// ---------------------------------------------------------------------------
// Comunicação com o mri_Qadmin (iframe) e com o próprio script (NUI callbacks)
// ---------------------------------------------------------------------------
const RES = (location.hostname.match(/^cfx-nui-(.+)$/) || [])[1]
    || (typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'm_radarmulta');
const EMBUTIDO = window.self !== window.top;

function paraPainel(msg) { if (EMBUTIDO) window.parent.postMessage(msg, '*'); }

async function nui(nome, dados) {
    if (window.__mock) return window.__mock(nome, dados);
    const r = await fetch(`https://${RES}/${nome}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(dados || {}),
    });
    return r.json();
}

// ---------------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------------
let D = null;
let selecionado = null;
let busca = '';
let aba = 'radares';
let isentosEditando = null;   // Set com os jobs marcados (enquanto não salva)
let soEmServicoEditando = null;

const arr = (x) => Array.isArray(x) ? x : Object.values(x || {});
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinheiro = (n) => 'R$ ' + Number(n || 0).toLocaleString('pt-BR');
const num = (n) => Number(n || 0).toLocaleString('pt-BR');

async function carregar() {
    const d = await nui('plugin:lista');
    if (!d) {
        document.getElementById('app').innerHTML = '<div class="carregando">Você não tem permissão para gerenciar radares.</div>';
        return;
    }
    D = d;
    D.radares = arr(D.radares);
    D.faixas = arr(D.faixas);
    D.empregos = arr(D.empregos);
    if (!selecionado || !D.radares.find(r => r.id === selecionado)) selecionado = D.radares[0]?.id || null;
    render();
}

// ---------------------------------------------------------------------------
// Avisos e modais
// ---------------------------------------------------------------------------
function aviso(msg, tipo) {
    if (!msg) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 5000);
}

let modalAberto = false;
function modal({ titulo, texto, campos, botao, perigo }) {
    return new Promise(resolve => {
        modalAberto = true;
        const el = document.getElementById('modal');
        el.innerHTML = `
            <div class="modal-fundo">
                <div class="modal">
                    <h4>${esc(titulo)}</h4>
                    ${texto ? `<p>${texto}</p>` : ''}
                    <div class="corpo">${campos || ''}</div>
                    <div class="pe">
                        <button class="btn" data-r="nao">Voltar</button>
                        <button class="btn ${perigo ? 'danger' : 'primary'}" data-r="sim">${esc(botao || 'Confirmar')}</button>
                    </div>
                </div>
            </div>`;
        const fechar = (v) => { modalAberto = false; el.innerHTML = ''; resolve(v); };
        el.querySelector('[data-r=nao]').onclick = () => fechar(null);
        el.querySelector('[data-r=sim]').onclick = () => {
            const vals = {};
            el.querySelectorAll('[name]').forEach(i => vals[i.name] = i.type === 'checkbox' ? i.checked : i.value);
            fechar(vals);
        };
        el.querySelector('.modal-fundo').onclick = (e) => { if (e.target.classList.contains('modal-fundo')) fechar(null); };
        const primeiro = el.querySelector('input, select');
        if (primeiro) primeiro.focus();
    });
}

async function acao(nome, id, dados) {
    const r = await nui('plugin:acao', { nome, id, dados });
    aviso(r && r.msg, r && r.ok ? 'ok' : 'erro');
    await carregar();
    return r;
}

async function mundo(tipo, dados) {
    const r = await nui('plugin:mundo', { tipo, dados });
    if (r && r.msg) aviso(r.msg, r.ok ? 'ok' : 'erro');
    return r;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const ICONE = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`;
const LUPA = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`;

function sentidoTexto(r) {
    return r.heading == null ? 'Dois sentidos' : `Só um sentido (${Math.round(r.heading)}°)`;
}

function renderLista() {
    const el = document.querySelector('.lista');
    if (!el) return;
    const q = busca.trim().toLowerCase();
    const lista = D.radares.filter(r => !q || r.nome.toLowerCase().includes(q) || String(r.id) === q);
    el.innerHTML = lista.length ? lista.map(r => `
        <div class="item ${r.id === selecionado ? 'on' : ''}" data-id="${r.id}">
            <span class="dot" style="background:${r.ativo ? 'var(--danger)' : '#666'}"></span>
            <div class="txt">
                <div class="nome">${esc(r.nome)}</div>
                <div class="sub">${r.limite} km/h · ${r.forma === 'poligono' ? 'área desenhada' : 'círculo ' + Math.round(r.raio) + 'm'}${r.ativo ? '' : ' · desligado'}</div>
            </div>
        </div>`).join('')
        : `<div class="vazio">${D.radares.length ? 'Nenhum radar com esse nome.' : 'Nenhum radar ainda.<br>Vá até o local e clique em <b>+ Criar radar aqui</b>.'}</div>`;
    el.querySelectorAll('.item').forEach(i => i.onclick = () => { selecionado = Number(i.dataset.id); render(); });
}

function renderDetalhe() {
    const r = D.radares.find(x => x.id === selecionado);
    if (!r) return `<div class="vazio" style="margin-top:60px">Selecione ou crie um radar.</div>`;
    const multaA = r.limite + Number(D.tolerancia || 0) + 1;
    return `
        <div class="topo">
            <div style="flex:1;min-width:0">
                <h2>${esc(r.nome)}</h2>
                <div class="ids">Radar nº ${r.id} · centro ${r.centro.x}, ${r.centro.y}, ${r.centro.z}</div>
                <div class="chips">
                    <span class="chip ${r.ativo ? 'green' : 'red'}">${r.ativo ? 'Ligado' : 'Desligado'}</span>
                    <span class="chip blue">${r.forma === 'poligono' ? `Área desenhada · ${r.cantos} cantos` : `Círculo · ${Math.round(r.raio)}m de raio`}</span>
                    <span class="chip">${num(r.tamanho)} m²</span>
                    <span class="chip yellow">${sentidoTexto(r)}</span>
                </div>
            </div>
            <button class="btn" id="bIr">Ir até o radar</button>
        </div>

        <div class="cols">
            <div class="card">
                <h3>Radar</h3>
                <div class="corpo">
                    <div class="linha">
                        <div class="campo" style="flex:2"><label>Nome (aparece na multa)</label><input type="text" id="fNome" maxlength="60" value="${esc(r.nome)}"></div>
                        <div class="campo"><label>Limite (km/h)</label><input type="number" id="fLimite" min="10" max="400" value="${r.limite}"></div>
                    </div>
                    <div class="dica">Com a tolerância de ${D.tolerancia} km/h, multa a partir de <b>${multaA} km/h</b>.</div>
                    <div class="linha">
                        <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">
                            <span class="toggle"><input type="checkbox" id="fAtivo" ${r.ativo ? 'checked' : ''}><span></span></span>
                            Radar ligado
                        </label>
                        <button class="btn primary" id="bSalvar">Salvar</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Área <small>${r.forma === 'poligono' ? 'desenhada' : 'círculo'}</small></h3>
                <div class="corpo">
                    ${r.forma === 'poligono' ? `
                        <div class="dica" style="margin-top:0">O radar mede quem passa dentro da área desenhada (${r.cantos} cantos).</div>
                        <div class="linha">
                            <button class="btn primary" id="bDesenhar">Redesenhar a área</button>
                            <button class="btn" id="bCirculo">Voltar a ser círculo</button>
                        </div>` : `
                        <div class="linha">
                            <div class="campo"><label>Raio (m)</label><input type="number" id="fRaio" min="3" max="300" value="${Math.round(r.raio)}"></div>
                            <button class="btn" id="bRaio">Salvar raio</button>
                        </div>
                        <div class="linha">
                            <button class="btn primary" id="bDesenhar">Desenhar a área</button>
                            <button class="btn" id="bMover">Mover o centro pra onde estou</button>
                        </div>
                        <div class="dica">Desenhar a área: o painel fecha e você marca os cantos no jogo, igual aos territórios.</div>`}
                </div>
            </div>

            <div class="card">
                <h3>Sentido</h3>
                <div class="corpo">
                    <div class="dica" style="margin-top:0">${r.heading == null
                        ? 'Multa quem passa nos <b>dois sentidos</b> da pista.'
                        : `Só multa quem vai na direção <b>${Math.round(r.heading)}°</b> (folga de ${r.margem}° pra cada lado). A seta amarela mostra o sentido quando as áreas estão visíveis.`}</div>
                    <div class="linha">
                        <button class="btn" id="bSentido">Usar a direção pra onde estou virado</button>
                        ${r.heading != null ? `<button class="btn" id="bDoisSentidos">Multar nos dois sentidos</button>` : ''}
                    </div>
                    <div class="dica">Fique no meio da pista, de frente pro sentido que deve ser multado (dentro do carro funciona também), e clique no botão.</div>
                </div>
            </div>

            <div class="card">
                <h3>Excluir</h3>
                <div class="corpo">
                    <div class="dica" style="margin-top:0">Apaga o radar do banco. Multas que já foram aplicadas continuam no banco dos jogadores.</div>
                    <div class="linha"><button class="btn danger" id="bExcluir">Excluir radar</button></div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top:14px">
            <h3>Valores das multas <small>config.lua</small></h3>
            <div class="corpo">
                <table class="tabela">
                    ${D.faixas.map((f, i) => `<tr><td><b>${esc(f.nome)}</b></td><td>${f.ate != null ? `até ${f.ate}% acima do limite` : `mais de ${D.faixas[i - 1]?.ate ?? 0}% acima do limite`}</td><td class="acoes">${dinheiro(f.valor)}</td></tr>`).join('')}
                </table>
                <div class="dica">O dinheiro das multas vai para a conta <b>${esc(D.contaDestino)}</b> no ps-banking. Valores, tolerância e isenções ficam no config.lua.</div>
            </div>
        </div>`;
}

function render() {
    const app = document.getElementById('app');
    const rolagem = {};
    ['.lista', '.detalhe', '.faccoes-wrap'].forEach(s => { const el = app.querySelector(s); if (el) rolagem[s] = el.scrollTop; });
    const foco = document.activeElement && document.activeElement.id;
    app.innerHTML = `
        <header>
            <h1>${ICONE} Radares <span class="badge">${D.radares.length} radar${D.radares.length === 1 ? '' : 'es'}</span></h1>
            <div class="spacer"></div>
            ${aba === 'radares' ? `
            <div class="search">${LUPA}<input type="text" id="busca" placeholder="Buscar radar..." value="${esc(busca)}"></div>
            <button class="btn ${D.mostrarAreas ? 'on' : ''}" id="bAreas">${D.mostrarAreas ? 'Esconder áreas' : 'Mostrar áreas'}</button>
            <button class="btn primary" id="bCriar">+ Criar radar aqui</button>` : ''}
        </header>
        <div class="tabs">
            <button class="tab ${aba === 'radares' ? 'on' : ''}" data-aba="radares">Radares</button>
            <button class="tab ${aba === 'isencoes' ? 'on' : ''}" data-aba="isencoes">Isenções</button>
        </div>
        <main>${aba === 'radares' ? `
            <div class="lista"></div>
            <div class="detalhe">${renderDetalhe()}</div>` : `<div class="faccoes-wrap">${renderIsencoes()}</div>`}
        </main>`;

    app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; isentosEditando = null; soEmServicoEditando = null; render(); });
    if (aba === 'radares') {
        renderLista();
        app.querySelector('#bAreas').onclick = async () => { const r = await mundo('areas'); if (r) { D.mostrarAreas = r.mostrarAreas; render(); } };
        app.querySelector('#bCriar').onclick = criarRadar;
        const b = app.querySelector('#busca');
        b.oninput = () => { busca = b.value; renderLista(); };
        ligarDetalhe();
    } else {
        ligarIsencoes();
    }

    Object.entries(rolagem).forEach(([s, y]) => { const el = app.querySelector(s); if (el) el.scrollTop = y; });
    if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); if (el.setSelectionRange && el.type === 'text') el.setSelectionRange(el.value.length, el.value.length); } }
}

function ligarDetalhe() {
    const r = D.radares.find(x => x.id === selecionado);
    if (!r) return;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

    on('bIr', () => mundo('irPara', { coords: r.centro }));
    on('bSalvar', () => acao('editar', r.id, {
        nome: document.getElementById('fNome').value,
        limite: Number(document.getElementById('fLimite').value),
        ativo: document.getElementById('fAtivo').checked,
    }));
    on('bRaio', () => acao('editar', r.id, { raio: Number(document.getElementById('fRaio').value) }));
    on('bDesenhar', () => mundo('desenhar', { id: r.id }));
    on('bMover', async () => {
        if (await modal({ titulo: 'Mover o centro?', texto: 'O centro do círculo vai para onde o seu personagem está agora.', botao: 'Mover' })) acao('moverAqui', r.id);
    });
    on('bCirculo', async () => {
        if (await modal({ titulo: 'Voltar a ser círculo?', texto: 'O desenho da área é apagado e vira um círculo do mesmo tamanho, no meio da área.', botao: 'Usar círculo', perigo: true })) acao('circulo', r.id);
    });
    on('bSentido', async () => { await mundo('sentidoAtual', { id: r.id }); await carregar(); });
    on('bDoisSentidos', () => acao('sentido', r.id, { heading: false }));
    on('bExcluir', async () => {
        if (await modal({ titulo: 'Excluir radar?', texto: `O radar <b>${esc(r.nome)}</b> será apagado do banco. Isso não dá pra desfazer.`, botao: 'Excluir', perigo: true })) acao('excluir', r.id);
    });
}

// ---------------------------------------------------------------------------
// Aba Isenções: empregos que não levam multa
// ---------------------------------------------------------------------------
const TIPO = { leo: 'Polícia', ems: 'Saúde', mechanic: 'Mecânica' };

function marcados() {
    if (!isentosEditando) isentosEditando = new Set(D.empregos.filter(e => e.isento).map(e => e.nome));
    if (soEmServicoEditando === null) soEmServicoEditando = !!D.soEmServico;
    return isentosEditando;
}

function alterado() {
    const orig = new Set(D.empregos.filter(e => e.isento).map(e => e.nome));
    const atual = marcados();
    if (soEmServicoEditando !== !!D.soEmServico) return true;
    if (orig.size !== atual.size) return true;
    for (const n of orig) if (!atual.has(n)) return true;
    return false;
}

function renderIsencoes() {
    const sel = marcados();
    const lista = D.empregos.map(e => `
        <div class="gang">
            <div class="txt">
                <b>${esc(e.label)}</b>
                <div>${esc(e.nome)}${e.tipo && TIPO[e.tipo] ? ' · ' + TIPO[e.tipo] : ''}${e.sumiu ? ' · <span style="color:var(--warn)">não existe mais no qbx_core</span>' : ''}</div>
            </div>
            <label class="toggle"><input type="checkbox" data-job="${esc(e.nome)}" ${sel.has(e.nome) ? 'checked' : ''}><span></span></label>
        </div>`).join('');
    return `
        <div class="card">
            <h3>Quem não leva multa <small>${sel.size} emprego${sel.size === 1 ? '' : 's'} marcado${sel.size === 1 ? '' : 's'}</small></h3>
            <div class="corpo">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
                    <span class="toggle"><input type="checkbox" id="fServico" ${soEmServicoEditando ? 'checked' : ''}><span></span></span>
                    Só fica livre da multa se estiver <b>em serviço</b>
                </label>
                <div class="dica">${soEmServicoEditando
                    ? 'Fora de serviço, quem tem um desses empregos leva multa como qualquer um.'
                    : 'Quem tem um desses empregos nunca leva multa, mesmo fora de serviço.'}
                    ${D.isentarEmergencia ? ' Viaturas de emergência (carros da classe emergência) também não levam multa, não importa quem dirige.' : ''}</div>
                <div class="linha">
                    <button class="btn primary" id="bSalvarIsencoes" ${alterado() ? '' : 'disabled'}>Salvar isenções</button>
                    ${alterado() ? '<span class="dica" style="margin:0;color:var(--warn)">Alterações não salvas</span>' : ''}
                </div>
            </div>
        </div>
        <div class="card">
            <h3>Empregos <small>marque os que não levam multa</small></h3>
            <div>${lista || '<div class="vazio">Nenhum emprego encontrado no qbx_core.</div>'}</div>
        </div>`;
}

function ligarIsencoes() {
    document.querySelectorAll('[data-job]').forEach(c => c.onchange = () => {
        const s = marcados();
        if (c.checked) s.add(c.dataset.job); else s.delete(c.dataset.job);
        render();
    });
    const sv = document.getElementById('fServico');
    if (sv) sv.onchange = () => { marcados(); soEmServicoEditando = sv.checked; render(); };
    const b = document.getElementById('bSalvarIsencoes');
    if (b) b.onclick = async () => {
        const jobs = [...marcados()];
        const soEmServico = soEmServicoEditando;
        isentosEditando = null; soEmServicoEditando = null;
        await acao('isencoes', null, { jobs, soEmServico });
    };
}

async function criarRadar() {
    const v = await modal({
        titulo: 'Criar radar aqui',
        texto: 'O radar é criado onde o seu personagem está agora.',
        botao: 'Criar',
        campos: `
            <div class="campo"><label>Nome (aparece na multa)</label><input type="text" name="nome" maxlength="60" placeholder="Ex.: Av. Paulista - sentido centro"></div>
            <div class="linha" style="margin-top:0">
                <div class="campo"><label>Limite (km/h)</label><input type="number" name="limite" min="10" max="400" value="${D.limitePadrao || 100}"></div>
                <div class="campo"><label>Raio se for círculo (m)</label><input type="number" name="raio" min="3" max="300" value="${Math.round(D.raioPadrao || 20)}"></div>
            </div>
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
                <span class="toggle"><input type="checkbox" name="desenhar" checked><span></span></span>
                Desenhar a área agora (o painel fecha e você marca os cantos no jogo)
            </label>`,
    });
    if (!v) return;
    const r = await mundo('criar', { nome: v.nome, limite: Number(v.limite), raio: Number(v.raio), desenhar: v.desenhar });
    if (r && r.ok && r.id) selecionado = r.id;
    if (r && r.ok && !v.desenhar) await carregar();
}

// ---------------------------------------------------------------------------
// Ciclo de vida do plugin
// ---------------------------------------------------------------------------
function aplicarTema(m) {
    if (m.accentColor && /^#[0-9a-f]{6}/i.test(m.accentColor)) document.documentElement.style.setProperty('--accent', m.accentColor.slice(0, 7));
    if (m.backgroundColor && /^#[0-9a-f]{6}/i.test(m.backgroundColor)) document.documentElement.style.setProperty('--bg', m.backgroundColor.slice(0, 7));
}

window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || typeof m.type !== 'string') return;
    if (m.type === 'mri-plugin/init') { aplicarTema(m); carregar(); }
    else if (m.type === 'mri-plugin/theme-changed') aplicarTema(m);
    else if (m.type === 'mri-plugin/navigate') carregar();
    else if (m.type === 'mri-plugin/visibility' && m.visible) carregar();
});

window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (modalAberto) { document.querySelector('[data-r=nao]')?.click(); return; }
    paraPainel({ type: 'mri-plugin/request-close' });
});

if (EMBUTIDO) paraPainel({ type: 'mri-plugin/ready' });
else carregar();
</script>
</body>
</html>
