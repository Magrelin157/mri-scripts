<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multas</title>
<script src="https://cfx-nui-sd-phone/web/build/sdphone-sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --azul: #2b5fa8; --azul-esc: #1f4d91; --azul-claro: #d6e2f0; --chip: #cfe0f5; --chip-txt: #2a67b8;
    --fundo: #dde5ee; --card: #e9eff6; --borda: #c9d4e1; --linha: #d3dce7;
    --titulo: #a5501e; --txt: #33404f; --cinza: #7c8896; --verde: #2f8a4f; --vermelho: #d23b33;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; background: var(--fundo); color: var(--txt);
    overflow: hidden; user-select: none; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(180deg, var(--azul) 0%, var(--azul-esc) 100%);
    padding: 58px 18px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  header h1 { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .olho { background: none; border: none; color: #fff; cursor: pointer; display: flex; padding: 4px; opacity: .95; }
  .olho svg { width: 24px; height: 24px; }

  main { flex: 1; overflow-y: auto; padding: 10px 12px 16px; }
  main::-webkit-scrollbar { width: 0; }
  .aba { display: none; }
  .aba.ativa { display: block; animation: entra .18s ease; }
  @keyframes entra { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 10px; overflow: hidden;
  }
  .card .topo { padding: 11px 14px 9px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .info { min-width: 0; flex: 1; }
  .linha1 { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--txt); }
  .chip { background: var(--chip); color: var(--chip-txt); font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; letter-spacing: .5px; }
  .chip.pol { background: #e3dcf3; color: #5b3fa6; }
  .data { font-size: 11px; color: var(--cinza); margin-top: 6px; }
  .nome-multa { font-size: 14px; font-weight: 700; color: var(--titulo); margin-top: 4px; }
  .desc { font-size: 11px; color: var(--cinza); margin-top: 3px; line-height: 1.35; }
  .grav { display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; margin-right: 4px; vertical-align: 1px; }
  .grav.media { background: #fbeccc; color: #9a6a06; }
  .grav.grave { background: #fde0cc; color: #b4520f; }
  .grav.gravissima { background: #f9d3d1; color: #b52620; }
  .grav.policia { background: #e3dcf3; color: #5b3fa6; }
  .card .valor { border-top: 1px solid var(--linha); padding: 9px 14px; font-size: 13px; color: var(--txt); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  .pago-tag { font-size: 10.5px; font-weight: 600; color: var(--verde); }

  .btn {
    background: var(--azul-claro); color: var(--azul); border: none; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 22px; cursor: pointer; flex-shrink: 0; transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(.96); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.cheio { background: var(--azul); color: #fff; width: 100%; padding: 12px; font-size: 14px; }

  /* Início */
  .resumo { background: linear-gradient(135deg, #2f67b5, #1c4a8c); color: #fff; border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(31,77,145,.25); }
  .resumo .rot { font-size: 11.5px; opacity: .85; }
  .resumo .big { font-size: 26px; font-weight: 700; margin-top: 2px; letter-spacing: .3px; }
  .resumo .sub { display: flex; justify-content: space-between; margin-top: 14px; font-size: 11.5px; opacity: .92; }
  .resumo .sub b { display: block; font-size: 14px; margin-top: 2px; }
  .ola { font-size: 13px; color: var(--txt); margin: 4px 2px 10px; }
  .ola b { color: var(--azul-esc); }
  .secao { font-size: 12px; font-weight: 700; color: var(--cinza); text-transform: uppercase; letter-spacing: .6px; margin: 16px 2px 8px; display: flex; justify-content: space-between; }
  .secao a { color: var(--azul); text-transform: none; letter-spacing: 0; cursor: pointer; font-weight: 600; }

  .vazio { text-align: center; padding: 48px 20px; color: var(--cinza); font-size: 13px; }
  .vazio svg { width: 54px; height: 54px; color: #9fb3c9; margin-bottom: 10px; }
  .vazio b { display: block; color: var(--txt); font-size: 14px; margin-bottom: 4px; }

  /* barra de abas */
  nav { background: #f4f7fa; border-top: 1px solid var(--borda); display: flex; padding: 8px 0 26px; flex-shrink: 0; }
  nav button { flex: 1; background: none; border: none; font: inherit; color: #9aa5b1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; cursor: pointer; position: relative; }
  nav button svg { width: 25px; height: 25px; }
  nav button.ativa { color: var(--azul); font-weight: 600; }
  .badge { position: absolute; top: -4px; left: calc(50% + 6px); background: var(--vermelho); color: #fff; font-size: 9.5px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: none; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid #f4f7fa; }
  .badge.on { display: flex; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: 96px; padding: 11px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 500; color: #fff; background: #2f3b4a; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; z-index: 9; }
  .toast.on { opacity: 1; transform: none; }
  .toast.ok { background: var(--verde); }
  .toast.erro { background: var(--vermelho); }
  .carregando { text-align: center; padding: 60px 0; color: var(--cinza); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="tituloTopo">Multas</h1>
  <button class="olho" id="olho" title="Mostrar/ocultar valores"></button>
</header>

<main>
  <section class="aba" id="aba-inicio"><div class="carregando">Carregando...</div></section>
  <section class="aba" id="aba-multas"></section>
  <section class="aba" id="aba-historico"></section>
</main>

<nav>
  <button data-aba="inicio">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6z"/></svg>
    Início
  </button>
  <button data-aba="historico">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12a1 1 0 0 1 1 1v19l-3-2-2 2-2-2-2 2-2-2-3 2V3a1 1 0 0 1 1-1zm2.5 5v2h7V7zm0 4v2h7v-2z"/></svg>
    Histórico
  </button>
  <button data-aba="multas">
    <span class="badge" id="badge">0</span>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 6.01A1.5 1.5 0 0 0 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h12v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-8zM6.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM5 11l1.5-4.5h11L19 11z"/></svg>
    Multas
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(() => {
  const TESTE = location.protocol === 'file:';
  const $ = s => document.querySelector(s);
  const OLHO_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>';
  const OLHO_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 4.5C18.5 4.5 22.5 12 22.5 12a17 17 0 0 1-3.3 4.2M6.2 6.6C3.3 8.5 1.5 12 1.5 12S5.5 19.5 12 19.5a9.6 9.6 0 0 0 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  const TITULOS = { inicio: 'Multas', multas: 'Multas', historico: 'Histórico' };

  let dados = null, aba = 'inicio', oculto = false, ocupado = false, timerToast;

  // ---------- teste no navegador (sem o jogo) ----------
  const mock = {
    nome: 'Magrão Silva', saldo: 48250,
    pendentes: [
      { id: 174, placa: 'TBH8W8R', gravidade: 'Gravíssima', origem: 'radar', descricao: 'Marginal Tietê - 152 km/h (lim. 90)', valor: 880, criado: 1793660000 },
      { id: 173, placa: 'TBH8W8R', gravidade: 'Grave', origem: 'radar', descricao: 'Av. Paulista - 71 km/h (lim. 50)', valor: 195, criado: 1793650000 },
      { id: 172, placa: null, gravidade: null, origem: 'policia', descricao: 'RDO #12 - Direção perigosa', valor: 5000, criado: 1793640000 },
      { id: 87, placa: '3RWAFA5', gravidade: 'Média', origem: 'radar', descricao: 'Rodovia - Grapeseed - 115 km/h (lim. 100)', valor: 130, criado: 1792700000 },
    ],
    pagas: [
      { id: 60, placa: '3RWAFA5', gravidade: 'Média', origem: 'radar', descricao: 'Rodovia - Vinewood Hills - 112 km/h (lim. 100)', valor: 130, criado: 1792000000, pagoEm: 1792100000 },
    ],
  };
  async function nui(nome, d) {
    if (TESTE) {
      await new Promise(r => setTimeout(r, 250));
      if (nome === 'estado') { mock.total = mock.pendentes.reduce((a, m) => a + m.valor, 0); return JSON.parse(JSON.stringify(mock)); }
      const pagar = nome === 'pagarTodas' ? mock.pendentes.slice() : mock.pendentes.filter(m => m.id === d.id);
      const total = pagar.reduce((a, m) => a + m.valor, 0);
      if (total > mock.saldo) return { ok: false, erro: 'Saldo insuficiente no banco.' };
      mock.saldo -= total;
      pagar.forEach(m => { m.pagoEm = Date.now() / 1000; mock.pagas.unshift(m); });
      mock.pendentes = mock.pendentes.filter(m => !pagar.includes(m));
      return { ok: true, pagas: pagar.length, valor: total };
    }
    return await fetchNui(nome, d || {});
  }
  async function confirmar(titulo, texto) {
    if (TESTE || typeof ShowConfirm !== 'function') return confirm(texto);
    return await ShowConfirm({ title: titulo, description: texto, confirmText: 'Pagar', cancelText: 'Cancelar' });
  }

  // ---------- formatação ----------
  const reais = v => oculto ? 'R$ •••••' : 'R$ ' + Number(v || 0).toLocaleString('pt-BR');
  const data = t => t ? new Date(t * 1000).toLocaleDateString('pt-BR') : '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const placaFmt = p => { p = String(p).replace(/\s+/g, ''); return p.length > 4 ? p.slice(0, 4) + ' ' + p.slice(4) : p; };
  const classeGrav = g => ({ 'média': 'media', 'media': 'media', 'grave': 'grave', 'gravíssima': 'gravissima', 'gravissima': 'gravissima' }[String(g || '').toLowerCase()] || 'grave');

  function card(m, pago) {
    const chip = m.placa
      ? `<span>Placa</span><span class="chip">${esc(placaFmt(m.placa))}</span>`
      : `<span>Origem</span><span class="chip pol">Polícia</span>`;
    const tag = m.gravidade ? `<span class="grav ${classeGrav(m.gravidade)}">${esc(m.gravidade)}</span>`
      : (m.origem === 'policia' ? '<span class="grav policia">Infração</span>' : '');
    return `
      <div class="card">
        <div class="topo">
          <div class="info">
            <div class="linha1">${chip}</div>
            <div class="data">${data(m.criado)}</div>
            <div class="nome-multa">Multa ${m.id}</div>
            <div class="desc">${tag}${esc(m.descricao)}</div>
          </div>
          ${pago ? '' : `<button class="btn" data-pagar="${m.id}">Pagar</button>`}
        </div>
        <div class="valor"><span>${reais(m.valor)}</span>${pago ? `<span class="pago-tag">Paga em ${data(m.pagoEm)}</span>` : ''}</div>
      </div>`;
  }

  const vazio = (titulo, texto) => `
    <div class="vazio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
      <b>${titulo}</b>${texto}
    </div>`;

  function desenhar() {
    if (!dados) return;
    if (dados.erro) { $('#aba-inicio').innerHTML = `<div class="carregando">${esc(dados.erro)}</div>`; return; }
    const pend = dados.pendentes || [], pagas = dados.pagas || [];
    const nome = (dados.nome || '').split(' ')[0];

    $('#aba-inicio').innerHTML = `
      ${nome ? `<div class="ola">Olá, <b>${esc(nome)}</b></div>` : ''}
      <div class="resumo">
        <div class="rot">Total em multas</div>
        <div class="big">${reais(dados.total)}</div>
        <div class="sub">
          <div>Multas em aberto<b>${pend.length}</b></div>
          <div style="text-align:right">Saldo no banco<b>${reais(dados.saldo)}</b></div>
        </div>
      </div>
      ${pend.length ? `<button class="btn cheio" id="pagarTodas">Pagar todas (${reais(dados.total)})</button>` : ''}
      <div class="secao"><span>Últimas multas</span>${pend.length > 3 ? '<a data-ir="multas">Ver todas</a>' : ''}</div>
      ${pend.length ? pend.slice(0, 3).map(m => card(m)).join('') : vazio('Tudo em dia', 'Nenhuma multa em aberto nos seus veículos.')}
    `;
    $('#aba-multas').innerHTML = pend.length ? pend.map(m => card(m)).join('') : vazio('Nenhuma multa', 'Você não tem multas pra pagar.');
    $('#aba-historico').innerHTML = pagas.length ? pagas.map(m => card(m, true)).join('') : vazio('Sem histórico', 'Multas pagas aparecem aqui.');

    const b = $('#badge');
    b.textContent = pend.length > 99 ? '99+' : pend.length;
    b.classList.toggle('on', pend.length > 0);
  }

  function irPara(nova) {
    aba = nova;
    document.querySelectorAll('.aba').forEach(s => s.classList.toggle('ativa', s.id === 'aba-' + nova));
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('ativa', b.dataset.aba === nova));
    $('#tituloTopo').textContent = TITULOS[nova];
    $('main').scrollTop = 0;
  }

  function toast(msg, tipo) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'toast on ' + (tipo || '');
    clearTimeout(timerToast);
    timerToast = setTimeout(() => t.className = 'toast', 2600);
  }

  async function carregar() {
    const r = await nui('estado');
    dados = r || { erro: 'Sem sinal.' };
    desenhar();
  }

  async function pagar(id) {
    if (ocupado) return;
    const todas = id == null;
    const m = !todas && (dados.pendentes || []).find(x => x.id === id);
    if (!todas && !m) return;
    const valor = todas ? dados.total : m.valor;
    const texto = todas
      ? `Pagar ${dados.pendentes.length} multa(s) no total de R$ ${Number(valor).toLocaleString('pt-BR')}? O valor sai do seu saldo no banco.`
      : `Pagar a Multa ${id} de R$ ${Number(valor).toLocaleString('pt-BR')}? O valor sai do seu saldo no banco.`;
    if (!(await confirmar(todas ? 'Pagar todas' : 'Pagar multa', texto))) return;

    ocupado = true;
    document.querySelectorAll('[data-pagar], #pagarTodas').forEach(b => b.disabled = true);
    const r = todas ? await nui('pagarTodas') : await nui('pagar', { id });
    ocupado = false;
    if (r && r.ok) toast(r.pagas > 1 ? `${r.pagas} multas pagas!` : 'Multa paga!', 'ok');
    else toast((r && r.erro) || 'Não deu pra pagar.', 'erro');
    await carregar();
  }

  function trocarOlho() {
    oculto = !oculto;
    $('#olho').innerHTML = oculto ? OLHO_OFF : OLHO_ON;
    if (!TESTE && typeof SetStorage === 'function') SetStorage('oculto', oculto);
    desenhar();
  }

  // ---------- eventos ----------
  document.addEventListener('click', e => {
    const p = e.target.closest('[data-pagar]');
    if (p) return pagar(Number(p.dataset.pagar));
    if (e.target.closest('#pagarTodas')) return pagar(null);
    const ir = e.target.closest('[data-ir]');
    if (ir) return irPara(ir.dataset.ir);
    const nav = e.target.closest('nav button');
    if (nav) return irPara(nav.dataset.aba);
  });
  $('#olho').addEventListener('click', trocarOlho);

  let polling, iniciou = false;
  async function iniciar() {
    if (iniciou) return; iniciou = true;
    if (!TESTE && typeof GetStorage === 'function') {
      try { oculto = (await GetStorage('oculto', false)) === true; } catch (_) {}
    }
    $('#olho').innerHTML = oculto ? OLHO_OFF : OLHO_ON;
    irPara('inicio');
    carregar();
    if (TESTE) return;
    onNuiEvent('atualizar', carregar);
    const ligar = () => { clearInterval(polling); polling = setInterval(carregar, 8000); };
    OnAppOpen(() => { carregar(); ligar(); });
    OnAppClose(() => clearInterval(polling));
    ligar();
  }

  if (TESTE) iniciar();
  else if (window.sdphone && sdphone.ready) sdphone.ready.then(iniciar);
  else {
    const t = setInterval(() => { if (window.componentsLoaded) { clearInterval(t); iniciar(); } }, 50);
    addEventListener('message', e => { if (e.data === 'componentsLoaded') { clearInterval(t); iniciar(); } });
  }
})();
</script>
</body>
</html>
