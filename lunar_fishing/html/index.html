<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>lunar_fishing minigame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="minigame" class="hidden">
        <canvas id="game" width="46" height="164"></canvas>
        <div id="result"></div>
        <div id="hint">
            <span class="label">SEGURE</span>
            <span class="keys">
                <span class="key">E</span>
                <span class="or">ou</span>
                <span class="key mouse"><i class="mouse-icon"><b></b></i></span>
                <span class="or">ou</span>
                <span class="key wide">ESPAÇO</span>
            </span>
            <span class="label small">pra subir a barra verde</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
